<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘驚喜 - 文言文大師成就解鎖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
      position: relative;
    }
    h1 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 15px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 30px;
    }
    .gift-box {
      font-size: 80px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease;
      display: inline-block;
      margin: 20px 0;
      animation: pulse 1.8s infinite;
    }
    .gift-box:hover {
      transform: scale(1.15) rotate(5deg);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .btn-open {
      background: #38bdf8;
      color: #0f172a;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }
    .btn-open:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
    .secret-content {
      display: none;
      margin-top: 25px;
      animation: fadeIn 1s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .quote-box {
      background: #0f172a;
      border-left: 4px solid #f59e0b;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #fcd34d;
    }
    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      padding: 6px 16px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="confetti"></canvas>
    
    <div id="lock-section">
      <div class="badge">十關全破解鎖</div>
      <h1>📜 神秘典藏錦囊</h1>
      <p class="subtitle">點擊下方的寶箱，開啟專屬你的神秘驚喜！</p>
      <div class="gift-box" onclick="openGift()">🎁</div>
      <br>
      <button class="btn-open" onclick="openGift()">開啟驚喜</button>
    </div>

    <div id="secret-section" class="secret-content">
      <div class="badge">🏆 文言文創作大師 🏆</div>
      <h1>🎉 恭喜闖關成功！</h1>
      <p class="subtitle">能將白話文精煉成充滿畫面與氣勢的古代詞句，這份文采極為難得！</p>
      
      <div class="quote-box">
        <strong>✨ 絕妙終章回顧：</strong><br>
        「如心函火，總有法滴水穿時、氣翻樹根」<br><br>
        以「心火」寓志向，以「滴水穿石、氣翻樹根」寫堅韌。願你永保這份熱情與才華，在未來的所有挑戰中都能無堅不摧！
      </div>

      <p style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.6;">
        🌟 感謝你帶來這場精彩的文言文對挑戰！這座網頁是你獨一無二的勝利紀念獎牌。
      </p>
    </div>
  </div>

  <script>
    function openGift() {
      document.getElementById('lock-section').style.display = 'none';
      document.getElementById('secret-section').style.display = 'block';
      startConfetti();
    }

    // 煙火特效
    function startConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const pieces = [];
      const colors = ['#38bdf8', '#f59e0b', '#34d399', '#f43f5e', '#a855f7'];

      for (let i = 0; i < 80; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 3 + 2,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 4 - 2
        });
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.y += p.speed;
          p.rotation += p.rotSpeed;
          if (p.y > canvas.height) p.y = -10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        requestAnimationFrame(update);
      }
      update();
    }
  </script>
</body>
</html>
